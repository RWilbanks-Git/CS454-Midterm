services:
  api:
    image: cs454-midterm
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SERVICE_NAME: cs454-midterm
      MESSAGE: Hello this is Docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
